name: Moodiary V3 W8.4 Authenticated Image Staging API
on:
  push:
    branches:
      - moodiary-v3-monthly-lan-dev-20261107
      - moodiary-v3-w8-media-validation-20261107
      - moodiary-v3-w8-staged-http-20261107
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  v3-lan-w7:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Unpack W1 source bundle
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode moodiary-longrecord/build-payload.b64 > /tmp/moodiary-v3-w1.zip
          unzip -q /tmp/moodiary-v3-w1.zip
          python3 modkit/verify_patch.py
      - name: Check out pinned upstream and apply baseline + V3 overlays
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/ZhuJHua/moodiary.git upstream
          cd upstream
          git checkout 2c552ddd7939a054122380397fb914cf000824b0
          python3 ../modkit/apply_beta_patch.py .
          python3 ../modkit/apply_v3_patch.py .
          unzip -q ../moodiary-v3-w2/ledger-source.zip -d /tmp/moodiary-v3-w2
          cp /tmp/moodiary-v3-w2/overlay/mobile/lib/app/home/mod_monthly_ledger.dart mobile/lib/app/home/
          cp /tmp/moodiary-v3-w2/overlay/mobile/test/mod_monthly_ledger_test.dart mobile/test/
          base64 --decode ../moodiary-v3-w3/live-events.b64 > /tmp/moodiary-v3-w3.zip
          unzip -q /tmp/moodiary-v3-w3.zip -d /tmp/moodiary-v3-w3
          cp /tmp/moodiary-v3-w3/overlay/mobile/lib/app/home/mod_lan_service.dart mobile/lib/app/home/
          cp /tmp/moodiary-v3-w3/overlay/mobile/lib/app/home/mod_lan_events.dart mobile/lib/app/home/
          cp /tmp/moodiary-v3-w3/overlay/mobile/test/mod_lan_events_test.dart mobile/test/
          python3 ../moodiary-v3-w3/fix_replay_cursor.py
          base64 --decode ../moodiary-v3-w4/source.b64 > /tmp/moodiary-v3-w4.zip
          unzip -q /tmp/moodiary-v3-w4.zip -d /tmp/moodiary-v3-w4
          python3 /tmp/moodiary-v3-w4/scripts/patch_repository.py .
          cp /tmp/moodiary-v3-w4/overlay/mobile/lib/app/home/mod_lan_service.dart mobile/lib/app/home/
          cp /tmp/moodiary-v3-w4/overlay/mobile/lib/app/home/mod_lan_write.dart mobile/lib/app/home/
          cp /tmp/moodiary-v3-w4/overlay/mobile/lib/app/home/mod_lan_page.dart mobile/lib/app/home/
          cp /tmp/moodiary-v3-w4/overlay/mobile/test/mod_lan_write_test.dart mobile/test/
          cp /tmp/moodiary-v3-w4/overlay/mobile/test/mod_lan_database_cas_test.dart mobile/test/
          python3 ../moodiary-v3-w5/apply_w5.py .
          python3 ../moodiary-v3-w6/apply_w6.py .
          python3 ../moodiary-v3-w7/apply_w7.py .
          python3 ../moodiary-v3-w8/apply_w8.py .
          python3 ../moodiary-v3-w8-http/apply_w8_http.py .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify deployed browser JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          data = Path('upstream/mobile/lib/app/home/mod_lan_service.dart').read_text()
          source = data.split("const _script = r'''", 1)[1].split("'''", 1)[0]
          Path('/tmp/moodiary-v3-w3-app.js').write_text(source)
          PY
          node --check /tmp/moodiary-v3-w3-app.js
          node /tmp/moodiary-v3-w4/scripts/browser-write.test.cjs /tmp/moodiary-v3-w3-app.js
          node moodiary-v3-w5/browser_race.test.cjs /tmp/moodiary-v3-w3-app.js
      - name: Build and test actual PC Tiptap editor
        working-directory: upstream/packages/feature_base/moodiary_editor/editor
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm exec tsc --project lan/tsconfig.json --noEmit
          corepack pnpm exec vitest run lan/src/w7.test.ts
          corepack pnpm exec vite build --config lan/vite.config.ts
          test -s ../../../../mobile/assets/lan/index.html
          test -s ../../../../mobile/assets/lan/lan.js
          test -s ../../../../mobile/assets/lan/lan.css
          grep -q 'lan.js' ../../../../mobile/assets/lan/index.html
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          link-to-sdk: true
      - name: Rust 1.95
        run: rustup toolchain install 1.95.0 --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Flutter workspace dependencies
        working-directory: upstream
        run: |
          corepack enable
          flutter pub get
      - name: Dart formatting
        working-directory: upstream
        run: |
          dart format mobile/lib/app/home/mod_continuous.dart
          dart format mobile/lib/app/home/mod_monthly_index.dart
          dart format mobile/lib/app/home/mod_monthly_ledger.dart
          dart format mobile/test/mod_monthly_ledger_test.dart
          dart format mobile/lib/app/home/mod_lan_image_policy.dart
          dart format mobile/lib/app/home/mod_lan_image_staging.dart
          dart format mobile/lib/app/home/mod_lan_image_decoder.dart
          dart format mobile/test/mod_lan_image_decoder_test.dart
          dart format mobile/lib/app/home/mod_lan_rich.dart
          dart format mobile/test/mod_lan_rich_test.dart
          dart format mobile/lib/app/home/mod_lan_write.dart
          dart format mobile/test/mod_lan_write_test.dart
          dart format mobile/test/mod_lan_database_cas_test.dart
          dart format packages/feature_base/moodiary_data/lib/src/diary_repository.dart
          dart format packages/feature_base/moodiary_editor/lib/src/application/edit_controller.dart
          dart format mobile/lib/app/home/mod_lan_events.dart
          dart format mobile/test/mod_lan_events_test.dart
          dart format mobile/lib/app/home/mod_lan_service.dart
          dart format mobile/lib/app/home/mod_lan_page.dart
          dart format mobile/test/mod_monthly_index_test.dart
          dart format mobile/test/mod_lan_policy_test.dart
      - name: "Unit tests: W7 assets + W6 rich CAS + W5 autosave + W4 editor + W3 realtime + W2 ledger + LAN policy"
        working-directory: upstream/mobile
        run: |
          flutter test test/mod_lan_image_decoder_test.dart test/mod_lan_rich_test.dart test/mod_lan_write_test.dart test/mod_lan_database_cas_test.dart test/mod_lan_events_test.dart test/mod_monthly_ledger_test.dart test/mod_monthly_index_test.dart test/mod_lan_policy_test.dart test/mod_continuous_safety_test.dart --reporter expanded
      - name: "Regression: WebDAV partial download aborts push"
        working-directory: upstream/packages/feature/moodiary_sync
        run: flutter test test/sync/data/incremental_engine_test.dart --reporter expanded
      - name: Build V3 W8.4 arm64 APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        working-directory: upstream/mobile
        run: flutter build apk --flavor v3dev --release --target-platform android-arm64
      - name: Validate artifact
        run: |
          test -s upstream/mobile/build/app/outputs/flutter-apk/app-v3dev-release.apk
          sha256sum upstream/mobile/build/app/outputs/flutter-apk/app-v3dev-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Moodiary-V3-LAN-W8-4-Authenticated-TempUpload-arm64
          path: upstream/mobile/build/app/outputs/flutter-apk/app-v3dev-release.apk
          retention-days: 30
          if-no-files-found: error
