name: Moodiary Long-Record Beta Preview APK
on:
  push:
    branches:
      - moodiary-longrecord-beta-safety-20261107
    paths:
      - .github/workflows/moodiary-beta-preview.yml
      - moodiary-longrecord/build-payload.b64
  workflow_dispatch:
concurrency:
  group: moodiary-beta-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-arm64:
    name: Compile isolated Beta preview APK (not safety certified)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore source and verify
        shell: bash
        run: |
          set -euo pipefail
          base64 -d moodiary-longrecord/build-payload.b64 > /tmp/beta-kit.zip
          unzip -q /tmp/beta-kit.zip
          python3 modkit/verify_patch.py
          git clone --no-checkout https://github.com/ZhuJHua/moodiary.git upstream
          cd upstream
          git checkout 2c552ddd7939a054122380397fb914cf000824b0
          python3 ../modkit/apply_patch.py .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          link-to-sdk: true
      - name: Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Install Flutter dependencies
        working-directory: upstream
        run: |
          corepack enable
          flutter pub get
      - name: Compile Android ARM64 beta flavor
        working-directory: upstream/mobile
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: flutter build apk --flavor beta --release --target-platform android-arm64
      - name: Verify APK artifact
        run: |
          test -s upstream/mobile/build/app/outputs/flutter-apk/app-beta-release.apk
          sha256sum upstream/mobile/build/app/outputs/flutter-apk/app-beta-release.apk
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Moodiary-Beta-Preview-arm64-NOT-SAFETY-CERTIFIED
          path: upstream/mobile/build/app/outputs/flutter-apk/app-beta-release.apk
          if-no-files-found: error
          retention-days: 30
