name: Moodiary V3 Manual Android Release QA Gate
on:
  workflow_dispatch:
    inputs:
      qa_candidate_run_id:
        description: 'GitHub Actions run ID that produced the exact signed APK installed on the device'
        type: string
        required: true
      tested_sha:
        description: 'Exact 40-character Git commit SHA tested on Android'
        type: string
        required: true
      tested_apk_sha256:
        description: 'SHA-256 of the APK actually installed on the Android device'
        type: string
        required: true
      qa_evidence:
        description: 'Link to actual device test results: device/OS, upgrade, LAN, media, offline and interrupted restore'
        type: string
        required: true
      device_model:
        description: 'Device model and Android/HyperOS version'
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  verify-device-evidence:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: android-device-qa
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Moodiary-V3-Safe-${{ inputs.tested_sha }}-arm64
          path: /tmp/moodiary-qa
          run-id: ${{ inputs.qa_candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Fail closed unless the SAME APK bytes passed real-device QA
        shell: bash
        env:
          QA_CANDIDATE_RUN_ID: ${{ inputs.qa_candidate_run_id }}
          TESTED_SHA: ${{ inputs.tested_sha }}
          TESTED_APK_SHA256: ${{ inputs.tested_apk_sha256 }}
          QA_EVIDENCE: ${{ inputs.qa_evidence }}
          DEVICE_MODEL: ${{ inputs.device_model }}
        run: |
          set -euo pipefail
          cd /tmp/moodiary-qa
          [[ "$QA_CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid candidate run ID'; exit 1; }
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid tested Git SHA'; exit 1; }
          [[ "$TESTED_APK_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'Invalid tested APK SHA-256'; exit 1; }
          sha256sum --check app-v3safe-release.apk.sha256
          test -s BUILD-PROVENANCE.txt
          grep -Fx "source_commit=$TESTED_SHA" BUILD-PROVENANCE.txt
          grep -Fx "artifact_status=signed-QA-candidate-not-formal-release" BUILD-PROVENANCE.txt
          grep -Fx "original_first_import_device_qa=pending" BUILD-PROVENANCE.txt
          actual_sha="$(sha256sum app-v3safe-release.apk | awk '{print $1}')"
          test "$TESTED_SHA" = "$GITHUB_SHA" || { echo 'Tested Git SHA mismatch'; exit 1; }
          test "$TESTED_APK_SHA256" = "$actual_sha" || { echo 'Tested APK bytes differ from this build'; exit 1; }
          python3 "$GITHUB_WORKSPACE/moodiary-ci/check-qa-artifact.py" \
            --artifact-dir "$PWD" \
            --candidate-run-id "$QA_CANDIDATE_RUN_ID" \
            --tested-sha "$TESTED_SHA" \
            --tested-apk-sha256 "$TESTED_APK_SHA256" \
            --current-sha "$GITHUB_SHA"
          [[ "$QA_EVIDENCE" =~ ^https:// ]] || { echo 'Real-device QA evidence URL required'; exit 1; }
          test -n "$DEVICE_MODEL"
          {
            echo "tested_commit=$TESTED_SHA"
            echo "candidate_build_run=$QA_CANDIDATE_RUN_ID"
            echo "tested_apk_sha256=$actual_sha"
            echo "device_model=$DEVICE_MODEL"
            echo "qa_evidence=$QA_EVIDENCE"
            echo "qa_gate_run=$GITHUB_RUN_ID"
            echo "validated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > android-qa-gate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Moodiary-Android-QA-Gate-${{ github.sha }}
          path: /tmp/moodiary-qa/android-qa-gate.txt
          retention-days: 180
          if-no-files-found: error
