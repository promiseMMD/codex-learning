name: Moodiary Android candidate link probe (isolated)

on:
  push:
    branches:
      - moodiary-v3-w9-8-4-31-permanent-application-id-20261110
    paths:
      - '.github/workflows/moodiary-android-link-probe.yml'
      - 'scripts/moodiary_android_link_probe.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-link-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Android emulator POSIX no-clobber probe (no app, no secrets)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb push scripts/moodiary_android_link_probe.sh /data/local/tmp/moodiary_link_probe.sh
            adb shell sh /data/local/tmp/moodiary_link_probe.sh
            adb shell rm -f /data/local/tmp/moodiary_link_probe.sh
