name: Moodiary V3 Full Regression (Reusable)
on:
  workflow_call:
    inputs:
      build_apk:
        description: "Run full Android arm64 APK build and retain artifact"
        type: boolean
        required: false
        default: false
    secrets:
      MOODIARY_SAFE_KEYSTORE_BASE64:
        required: false
      MOODIARY_SAFE_STORE_PASSWORD:
        required: false
      MOODIARY_SAFE_KEY_PASSWORD:
        required: false
      MOODIARY_SAFE_CERT_SHA256:
        required: false
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Also build and archive arm64 APK"
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: moodiary-full-${{ github.ref }}-${{ inputs.build_apk }}
  cancel-in-progress: false
jobs:
  full-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      # Signing keys live ONLY in the independent Private signing vault.
      # Public source repo must never perform APK signing, even when a maintainer
      # accidentally configures repository Secrets here.
      - name: Refuse APK signing in public source repository
        if: ${{ inputs.build_apk }}
        shell: bash
        run: |
          echo "::error::APK signing is permitted only in promiseMMD/moodiary-signing-vault"
          exit 1
      - name: Reject signed APK builds outside the approved branch
        if: ${{ inputs.build_apk && github.ref != 'refs/heads/moodiary-v3-w9-8-4-31-permanent-application-id-20261110' }}
        shell: bash
        run: |
          echo "::error::Signed APK builds are restricted to the approved v3safe branch."
          exit 1
      - uses: actions/checkout@v4
      - name: Validate CI safety contract before full regression
        run: python3 moodiary-ci/check-gates.py
      - name: Fail early when persistent Android signing secrets are missing
        if: ${{ inputs.build_apk }}
        shell: bash
        env:
          MOODIARY_SAFE_KEYSTORE_BASE64: ${{ secrets.MOODIARY_SAFE_KEYSTORE_BASE64 }}
          MOODIARY_SAFE_STORE_PASSWORD: ${{ secrets.MOODIARY_SAFE_STORE_PASSWORD }}
          MOODIARY_SAFE_KEY_PASSWORD: ${{ secrets.MOODIARY_SAFE_KEY_PASSWORD }}
          MOODIARY_SAFE_CERT_SHA256: ${{ secrets.MOODIARY_SAFE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in MOODIARY_SAFE_KEYSTORE_BASE64 MOODIARY_SAFE_STORE_PASSWORD MOODIARY_SAFE_KEY_PASSWORD MOODIARY_SAFE_CERT_SHA256; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions signing secret: $name"
              exit 1
            fi
          done
          echo "Persistent signing configuration exists; certificate verification remains mandatory at the APK signing stage."
      - name: Prepare pinned upstream and apply ALL V3 overlays
        shell: bash
        run: bash moodiary-ci/prepare-workspace.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify deployed browser JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          data = Path('upstream/mobile/lib/app/home/mod_lan_service.dart').read_text()
          source = data.split("const _script = r'''", 1)[1].split("'''", 1)[0]
          Path('/tmp/moodiary-v3-w3-app.js').write_text(source)
          PY
          node --check /tmp/moodiary-v3-w3-app.js
          node /tmp/moodiary-v3-w4/scripts/browser-write.test.cjs /tmp/moodiary-v3-w3-app.js
          node moodiary-v3-w5/browser_race.test.cjs /tmp/moodiary-v3-w3-app.js
      - name: Build and test actual PC Tiptap editor
        working-directory: upstream/packages/feature_base/moodiary_editor/editor
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm exec tsc --noEmit
          corepack pnpm exec vitest run src
          corepack pnpm exec vite build
          corepack pnpm exec tsc --project lan/tsconfig.json --noEmit
          corepack pnpm exec vitest run lan/src/w7.test.ts lan/src/month_api.test.ts lan/src/month_workspace.test.tsx
          corepack pnpm exec vite build --config lan/vite.config.ts
          test -s ../../../../mobile/assets/lan/index.html
          test -s ../../../../mobile/assets/lan/lan.js
          test -s ../../../../mobile/assets/lan/lan.css
          grep -q 'lan.js' ../../../../mobile/assets/lan/index.html
      - name: Actual Chromium PC and mobile-width editor acceptance
        shell: bash
        run: |
          set -euo pipefail
          # Browser DOM/interaction checks must not depend on Ubuntu apt DNS.
          # Noto CJK is a SCREENSHOT rendering aid, not a functional dependency.
          # Record degraded visual coverage explicitly; never skip browser tests.
          mkdir -p /tmp/moodiary-w93-browser-qa
          font_status=/tmp/moodiary-w93-browser-qa/cjk-font-status.txt
          if ! fc-list :lang=zh 2>/dev/null | grep -q .; then
            echo 'No CJK font preinstalled; attempting bounded apt installation.'
            if timeout 90s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=12 update -qq &&
               timeout 120s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=12 install -y fonts-noto-cjk; then
              fc-cache -f >/dev/null
            else
              echo '::warning::Ubuntu font package mirror unavailable; running all browser functional tests, but CJK screenshot glyphs are not certified.'
            fi
          fi
          if fc-list :lang=zh 2>/dev/null | grep -q .; then
            echo 'CJK_FONT_RENDERING=available' > "$font_status"
          else
            echo 'CJK_FONT_RENDERING=unverified; visual screenshot acceptance pending' > "$font_status"
            echo '::warning::CJK screenshot rendering remains unverified; this does not count as a visual-font acceptance pass.'
          fi
          cat "$font_status"
          npm install --prefix /tmp/moodiary-lan-browser --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          export MOODIARY_PLAYWRIGHT_MODULE=/tmp/moodiary-lan-browser/node_modules/playwright
          export MOODIARY_CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node moodiary-v3-w9-3/browser_acceptance.cjs upstream/mobile/assets/lan /tmp/moodiary-w93-browser-qa
          node moodiary-v3-w9-4/native_browser_acceptance.cjs upstream/packages/feature_base/moodiary_editor/assets/editor/index.html /tmp/moodiary-w93-browser-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Moodiary-W9-3-Browser-QA
          path: /tmp/moodiary-w93-browser-qa
          retention-days: 7
          if-no-files-found: warn
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - uses: nttld/setup-ndk@v1
        if: ${{ inputs.build_apk }}
        id: ndk
        with:
          ndk-version: r28c
          link-to-sdk: true
      - name: Rust 1.95
        if: ${{ inputs.build_apk }}
        run: rustup toolchain install 1.95.0 --profile minimal
      - uses: taiki-e/install-action@v2
        if: ${{ inputs.build_apk }}
        with:
          tool: cargo-about@0.9.2
      - name: Rust Nutstore PROPFIND per-directory safety regression
        working-directory: upstream/packages/foundation/fast_core/rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 test sync::webdav::tests --lib
      - name: Flutter workspace dependencies
        working-directory: upstream
        run: |
          corepack enable
          flutter pub get
      - name: Generate and retain native monthly translations
        working-directory: upstream/packages/foundation/moodiary_i18n
        run: |
          if test -f ../../../../moodiary-v3-w9-5-2/generated-i18n.b64; then
            sha256sum lib/i18n/*.dart > /tmp/moodiary-w952-generated.sha256
          fi
          dart run slang
          if test -f /tmp/moodiary-w952-generated.sha256; then
            sha256sum --check /tmp/moodiary-w952-generated.sha256
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Moodiary-W9-5-2-Generated-I18n
          path: upstream/packages/foundation/moodiary_i18n/lib/i18n
          retention-days: 30
      - name: Native month source formatting
        working-directory: upstream
        run: |
          dart format packages/feature/moodiary_sync/test/sync/data/harness/real_sigkill_orchestrator.dart packages/feature/moodiary_sync/test/sync/data/harness/real_sigkill_slot_child.dart
          dart format packages/feature/moodiary_sync/lib/src/data/mod_month_orphan_inspector_v1.dart packages/feature/moodiary_sync/test/sync/data/mod_month_orphan_inspector_v1_test.dart
          dart format packages/feature/moodiary_sync/lib/src/data/mod_month_recovery_slot_v1.dart packages/feature/moodiary_sync/test/sync/data/mod_month_recovery_slot_v1_test.dart
          dart format packages/feature/moodiary_sync/lib/src/data/mod_month_recovery_slot_v2.dart packages/feature/moodiary_sync/test/sync/data/mod_month_recovery_slot_v2_test.dart packages/feature/moodiary_sync/test/sync/data/harness/real_sigkill_v2_orchestrator.dart packages/feature/moodiary_sync/test/sync/data/harness/real_sigkill_v2_slot_child_test.dart
          dart format packages/feature/moodiary_sync/lib/src/data/mod_month_isolated_restore_v1.dart packages/feature/moodiary_sync/test/sync/data/mod_month_isolated_restore_v1_test.dart
          dart format packages/feature/moodiary_sync/lib/src/data/mod_month_zip_preflight_v1.dart packages/feature/moodiary_sync/lib/src/data/mod_month_zip_bundle_v1.dart packages/feature/moodiary_sync/test/sync/data/mod_month_zip_bundle_v1_test.dart
          dart format packages/feature/moodiary_sync/lib/src/data/mod_month_zip_preflight_v2.dart packages/feature/moodiary_sync/lib/src/data/mod_month_zip_bundle_v2.dart packages/feature/moodiary_sync/lib/src/data/mod_month_isolated_restore_v2.dart packages/feature/moodiary_sync/lib/src/data/mod_month_recovery_slot_v2.dart packages/feature/moodiary_sync/lib/src/data/mod_month_zip_generation_install_v2.dart packages/feature/moodiary_sync/lib/src/data/mod_month_private_restore_workspace_v2.dart packages/feature/moodiary_sync/lib/src/data/mod_month_android_restore_root_v2.dart packages/feature/moodiary_sync/lib/src/data/mod_month_restore_inventory_v2.dart packages/feature/moodiary_sync/test/sync/data/mod_month_isolated_restore_v2_test.dart packages/feature/moodiary_sync/test/sync/data/mod_month_android_restore_root_v2_test.dart
          dart format packages/feature/moodiary_sync/lib/src/data/mod_month_stream_stage_v1.dart packages/feature/moodiary_sync/test/sync/data/mod_month_stream_stage_v1_test.dart
          dart format packages/feature/moodiary_sync/lib/src/data/mod_month_verified_manifest_v1.dart packages/feature/moodiary_sync/test/sync/data/mod_month_verified_manifest_v1_test.dart
          dart format packages/feature/moodiary_sync/lib/src/data/mod_month_verified_manifest_v2.dart packages/feature/moodiary_sync/test/sync/data/mod_month_verified_manifest_v2_test.dart packages/feature/moodiary_sync/lib/src/data/mod_month_stream_stage_v2.dart packages/feature/moodiary_sync/test/sync/data/mod_month_stream_stage_v2_test.dart
          dart format packages/feature_base/moodiary_data/lib/src/mod_month_graph_archive_v1.dart packages/feature_base/moodiary_data/test/mod_month_graph_archive_v1_test.dart
          dart format packages/feature_base/moodiary_data/lib/src/mod_month_graph_archive_v2.dart packages/feature_base/moodiary_data/test/mod_month_graph_archive_v2_test.dart
          dart format packages/feature_base/moodiary_data/lib/src/mod_day_schema.dart packages/feature_base/moodiary_data/lib/src/mod_day_map.dart packages/feature_base/moodiary_data/test/mod_day_map_test.dart
          dart format packages/feature_base/moodiary_data/lib/src/mod_month_archive_gate.dart packages/feature_base/moodiary_data/test/mod_month_archive_gate_test.dart
          dart format packages/feature/moodiary_sync/test/sync/data/mod_month_archive_gate_test.dart
          dart format packages/feature/moodiary_sync/lib/src/data/incremental_engine.dart packages/feature/moodiary_sync/lib/src/data/archive_apply.dart packages/feature/moodiary_sync/lib/src/data/impl/local_archive.dart
          dart format mobile/test/mod_home_quick_entry_test.dart
          dart format mobile/lib/app/home/mod_month_order.dart mobile/test/mod_month_order_test.dart mobile/test/mod_month_day_page_test.dart
          dart format mobile/lib/app/home/mod_month_day_preview.dart mobile/test/mod_month_day_preview_test.dart
          dart format mobile/lib/app/home/mod_day_home_index.dart mobile/lib/app/home/mod_day_home_panel.dart mobile/test/mod_day_home_index_test.dart mobile/test/mod_day_home_panel_test.dart
          dart format mobile/lib/app/home/mod_month_native.dart mobile/lib/app/home/mod_month_page.dart mobile/lib/app/home/mod_month_composer.dart mobile/lib/app/home/mod_month_updates.dart
          dart format mobile/test/mod_month_native_test.dart mobile/test/mod_month_page_test.dart mobile/test/mod_month_composer_test.dart packages/feature_base/moodiary_editor/lib/src/transport/editor_snapshot.dart packages/feature_base/moodiary_editor/lib/src/moodiary_editor.dart packages/feature_base/moodiary_editor/test/editor_snapshot_test.dart
      - name: Disable unused Rust asset hooks for Dart-only tests
        working-directory: upstream
        run: |
          cp pubspec.yaml /tmp/moodiary-w9-test-pubspec.yaml
          python3 - <<'PYHOOK'
          from pathlib import Path
          p = Path('pubspec.yaml')
          source = p.read_text()
          assert source.count('build_assets: true') == 6
          native = source.replace('build_assets: true', 'build_assets: false')
          anchor = '    fast_zip: {build_assets: false}'
          assert native.count(anchor) == 1
          native = native.replace(anchor, anchor + '\n    sqlite3: {source: system}')
          p.write_text(native)
          PYHOOK
      - name: Native editor acknowledgement and ordinary editor regression
        working-directory: upstream/packages/feature_base/moodiary_editor
        run: flutter test test/editor_snapshot_test.dart test/editor_activation_test.dart test/edit_controller_test.dart --reporter expanded
      - name: Dart formatting
        working-directory: upstream
        run: |
          dart format mobile/lib/app/home/mod_continuous.dart
          dart format mobile/lib/app/home/mod_monthly_index.dart
          dart format mobile/lib/app/home/mod_monthly_ledger.dart
          dart format mobile/test/mod_monthly_ledger_test.dart
          dart format mobile/lib/app/home/mod_lan_image_policy.dart
          dart format mobile/lib/app/home/mod_lan_image_staging.dart
          dart format mobile/lib/app/home/mod_lan_image_decoder.dart
          dart format packages/feature_base/moodiary_data/lib/src/mod_month_schema.dart
          dart format mobile/lib/app/home/mod_month_store.dart
          dart format mobile/lib/app/home/mod_lan_month_http.dart
          dart format mobile/test/mod_lan_month_http_test.dart
          dart format mobile/test/mod_month_disk_test.dart
          dart format mobile/test/mod_month_store_test.dart
          dart format mobile/lib/app/home/mod_lan_image_attach.dart
          dart format mobile/test/mod_lan_image_attach_test.dart
          dart format mobile/test/mod_lan_image_decoder_test.dart
          dart format mobile/lib/app/home/mod_lan_rich.dart
          dart format mobile/test/mod_lan_rich_test.dart
          dart format mobile/lib/app/home/mod_lan_write.dart
          dart format mobile/test/mod_lan_write_test.dart
          dart format mobile/test/mod_lan_database_cas_test.dart
          dart format packages/feature_base/moodiary_data/lib/src/diary_repository.dart
          dart format packages/feature_base/moodiary_editor/lib/src/application/edit_controller.dart
          dart format mobile/lib/app/home/mod_lan_events.dart
          dart format mobile/test/mod_lan_events_test.dart
          dart format mobile/lib/app/home/mod_lan_service.dart
          dart format mobile/lib/app/home/mod_lan_page.dart
          dart format mobile/test/mod_monthly_index_test.dart
          dart format mobile/test/mod_lan_policy_test.dart
          dart format mobile/lib/app/settings/storage/recovery_inventory_controller.dart mobile/lib/app/settings/storage/recovery_inventory_panel.dart mobile/lib/app/settings/storage/storage_page.dart mobile/test/app/settings/recovery_inventory_panel_test.dart mobile/test/app/settings/storage_page_test.dart
      - name: W9 migration from older v2 and v3 database preserves user diaries
        working-directory: upstream/packages/feature_base/moodiary_data
        run: flutter test test/mod_month_migration_test.dart test/mod_month_archive_gate_test.dart test/mod_month_graph_archive_v1_test.dart test/mod_month_graph_archive_v2_test.dart test/mod_month_graph_merge_v2_test.dart test/mod_day_map_test.dart --reporter expanded
      - name: "Unit tests: W7 assets + W6 rich CAS + W5 autosave + W4 editor + W3 realtime + W2 ledger + LAN policy"
        working-directory: upstream/mobile
        run: |
          flutter test test/mod_day_home_index_test.dart test/mod_day_home_panel_test.dart test/mod_home_quick_entry_test.dart test/mod_month_order_test.dart test/mod_month_day_page_test.dart test/mod_month_day_preview_test.dart test/mod_month_native_test.dart test/mod_month_page_test.dart test/mod_month_composer_test.dart test/mod_month_disk_test.dart test/mod_lan_month_http_test.dart test/mod_month_store_test.dart test/mod_lan_image_attach_test.dart test/mod_lan_image_decoder_test.dart test/mod_lan_rich_test.dart test/mod_lan_write_test.dart test/mod_lan_database_cas_test.dart test/mod_lan_events_test.dart test/mod_monthly_ledger_test.dart test/mod_monthly_index_test.dart test/mod_lan_policy_test.dart test/mod_continuous_safety_test.dart test/app/settings/recovery_inventory_panel_test.dart test/app/settings/storage_page_test.dart --reporter expanded
      - name: "Regression: WebDAV partial download aborts push"
        env:
          MOODIARY_CRASH_MATRIX: full
        working-directory: upstream/packages/feature/moodiary_sync
        run: flutter test test/sync/data/incremental_engine_test.dart test/sync/data/mod_month_archive_gate_test.dart test/sync/data/mod_month_verified_manifest_v1_test.dart test/sync/data/mod_month_stream_stage_v1_test.dart test/sync/data/mod_month_zip_bundle_v1_test.dart test/sync/data/mod_month_verified_manifest_v2_test.dart test/sync/data/mod_month_stream_stage_v2_test.dart test/sync/data/mod_month_isolated_restore_v1_test.dart test/sync/data/mod_month_isolated_restore_v2_test.dart test/sync/data/mod_month_recovery_slot_v1_test.dart test/sync/data/mod_month_recovery_slot_v2_test.dart test/sync/data/mod_month_isolated_restore_v2_test.dart test/sync/data/mod_month_full_backup_archive_v1_test.dart test/sync/data/mod_month_orphan_inspector_v1_test.dart test/sync/data/mod_nutstore_webdav_policy_test.dart test/sync/data/mod_month_android_restore_root_v2_test.dart test/sync/data/mod_month_webdav_full_zip_v1_test.dart --reporter expanded
      - name: "Real SIGKILL crash matrix: all seven checkpoints (standalone process)"
        working-directory: upstream/packages/feature/moodiary_sync
        env:
          MOODIARY_CRASH_MATRIX: full
        run: |
          dart run test/sync/data/harness/real_sigkill_orchestrator.dart
          dart run test/sync/data/harness/real_sigkill_v2_orchestrator.dart
      - name: Restore native build hooks for Android
        if: ${{ inputs.build_apk }}
        working-directory: upstream
        run: cp /tmp/moodiary-w9-test-pubspec.yaml pubspec.yaml
      - name: Authorize signed QA candidate ONLY (not formal APK release)
        if: ${{ inputs.build_apk }}
        run: python3 moodiary-ci/check-release-readiness.py --qa-candidate

      - name: Provision persistent safe signing identity (fail closed; no debug fallback)
        if: ${{ inputs.build_apk }}
        shell: bash
        env:
          MOODIARY_SAFE_KEYSTORE_BASE64: ${{ secrets.MOODIARY_SAFE_KEYSTORE_BASE64 }}
          MOODIARY_SAFE_STORE_PASSWORD: ${{ secrets.MOODIARY_SAFE_STORE_PASSWORD }}
          MOODIARY_SAFE_KEY_PASSWORD: ${{ secrets.MOODIARY_SAFE_KEY_PASSWORD }}
          MOODIARY_SAFE_CERT_SHA256: ${{ secrets.MOODIARY_SAFE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          [ -n "$MOODIARY_SAFE_KEYSTORE_BASE64" ] || { echo "::error::Missing MOODIARY_SAFE_KEYSTORE_BASE64 Actions secret"; exit 1; }
          [ -n "$MOODIARY_SAFE_STORE_PASSWORD" ] || { echo "::error::Missing MOODIARY_SAFE_STORE_PASSWORD Actions secret"; exit 1; }
          [ -n "$MOODIARY_SAFE_KEY_PASSWORD" ] || { echo "::error::Missing MOODIARY_SAFE_KEY_PASSWORD Actions secret"; exit 1; }
          [ -n "$MOODIARY_SAFE_CERT_SHA256" ] || { echo "::error::Missing MOODIARY_SAFE_CERT_SHA256 Actions secret"; exit 1; }
          keystore="$GITHUB_WORKSPACE/upstream/mobile/android/app/key.jks"
          printf '%s' "$MOODIARY_SAFE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          actual_cert="$(keytool -list -v -keystore "$keystore" -storepass:env MOODIARY_SAFE_STORE_PASSWORD -alias key0 \
            | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          expected_cert="$(printf '%s' "$MOODIARY_SAFE_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          [[ "$actual_cert" =~ ^[0-9a-f]{64}$ ]]
          [[ "$actual_cert" == "$expected_cert" ]] || { echo "::error::The JKS certificate does not match MOODIARY_SAFE_CERT_SHA256"; exit 1; }
          props="$GITHUB_WORKSPACE/upstream/mobile/android/local.properties"
          tmp="$(mktemp)"
          if [[ -f "$props" ]]; then
            grep -Ev '^(storePassword|keyPassword)=' "$props" > "$tmp" || true
          fi
          printf 'storePassword=%s\nkeyPassword=%s\n' "$MOODIARY_SAFE_STORE_PASSWORD" "$MOODIARY_SAFE_KEY_PASSWORD" >> "$tmp"
          mv "$tmp" "$props"
          echo "Persistent v3safe signing identity verified; private key was not logged or uploaded."

      - name: Build validated V3 safe parallel-install ARM64 APK
        if: ${{ inputs.build_apk }}
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        working-directory: upstream/mobile
        run: flutter build apk --flavor v3safe --release --target-platform android-arm64

      - name: Verify safe package, migration assets, persistent signer and APK hash
        if: ${{ inputs.build_apk }}
        shell: bash
        env:
          MOODIARY_SAFE_CERT_SHA256: ${{ secrets.MOODIARY_SAFE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk=upstream/mobile/build/app/outputs/flutter-apk/app-v3safe-release.apk
          test -s "$apk"
          mkdir -p /tmp/moodiary-ci-delivery
          python3 moodiary-v3-w9-8-4-12/verify_apk.py "$apk" | tee /tmp/moodiary-ci-delivery/APK-VERIFICATION.json
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$apksigner"
          aapt="$(dirname "$apksigner")/aapt"
          test -x "$aapt"
          "$apksigner" verify --verbose --print-certs "$apk" | tee /tmp/moodiary-ci-delivery/SIGNATURE.txt
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/moodiary-ci-delivery/SIGNATURE.txt
          "$aapt" dump badging "$apk" | tee /tmp/moodiary-ci-delivery/MANIFEST.txt
          grep -F "package: name='cn.yooss.moodiary.v3safe' versionCode='126' versionName='2.9.2'" /tmp/moodiary-ci-delivery/MANIFEST.txt
          grep -F "sdkVersion:'28'" /tmp/moodiary-ci-delivery/MANIFEST.txt
          grep -F "targetSdkVersion:'36'" /tmp/moodiary-ci-delivery/MANIFEST.txt
          cp "$apk" /tmp/moodiary-ci-delivery/app-v3safe-release.apk
          cd /tmp/moodiary-ci-delivery
          sha256sum app-v3safe-release.apk > app-v3safe-release.apk.sha256
          actual_signer="$(python3 -c 'import json; print(json.load(open("APK-VERIFICATION.json"))["signer_certificate_sha256"])' | tr '[:upper:]' '[:lower:]')"
          expected_signer="$(printf '%s' "$MOODIARY_SAFE_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          test -n "$actual_signer"
          test "$actual_signer" = "$expected_signer"
          {
            echo "source_commit=${{ github.sha }}"
            echo "upstream_release_tag=v2.9.2"
            echo "upstream_commit=2c552ddd7939a054122380397fb914cf000824b0"
            echo "workflow_run=${{ github.run_id }}"
            echo "workflow_ref=${{ github.ref }}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "application_id=cn.yooss.moodiary.v3safe"
            echo "previous_application_id=cn.yooss.moodiary.v3dev"
            echo "parallel_install=true"
            echo "artifact_status=signed-QA-candidate-not-formal-release"
            echo "original_first_import_device_qa=pending"
            echo "migration_method=official-original-native-ZIP-to-independent-modded-app"
            echo "version_name=2.9.2"
            echo "version_code=126"
            echo "abi=arm64-v8a"
            echo "signer_certificate_sha256=$actual_signer"
            echo "signer_compatibility=stable-persistent-v3safe-key"
            grep '^version:' "$GITHUB_WORKSPACE/upstream/mobile/pubspec.yaml"
          } > BUILD-PROVENANCE.txt
          sha256sum --check app-v3safe-release.apk.sha256
      - name: Remove signing material from ephemeral runner workspace
        if: ${{ always() && inputs.build_apk }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          rm -f "$GITHUB_WORKSPACE/upstream/mobile/android/app/key.jks"
          props="$GITHUB_WORKSPACE/upstream/mobile/android/local.properties"
          if [[ -f "$props" ]]; then
            tmp="$(mktemp)"
            grep -Ev '^(storePassword|keyPassword)=' "$props" > "$tmp" || true
            mv "$tmp" "$props"
          fi
          echo "Signing material cleanup completed."
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.build_apk }}
        with:
          name: Moodiary-V3-Safe-${{ github.sha }}-arm64
          path: /tmp/moodiary-ci-delivery/
          retention-days: 90
          if-no-files-found: error
