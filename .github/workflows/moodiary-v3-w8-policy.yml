name: Moodiary V3 W8 Image Intake Policy

on:
  push:
    branches:
      - moodiary-v3-w8-media-validation-20261107
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-image-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Dart formatting diagnostic
        run: |
          dart format --output=none             moodiary-v3-w8/overlay/mobile/lib/app/home/mod_lan_image_policy.dart             moodiary-v3-w8/tests/image_policy_smoke.dart
      - name: Bounded image MIME and stream safety regression
        run: dart run moodiary-v3-w8/tests/image_policy_smoke.dart
      - name: Resolve W8 staging digest dependency
        working-directory: moodiary-v3-w8
        run: dart pub get
      - name: Session-bound staging and CAS cleanup regression
        working-directory: moodiary-v3-w8
        run: dart run tests/image_staging_smoke.dart
      - name: Local HTTP image staging and authorization regression
        working-directory: moodiary-v3-w8
        run: dart run tests/image_http_smoke.dart
